# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
data:
  # General application settings
  APP_NAME: "Todo App"
  LOG_LEVEL: "INFO"
  
  # Backend settings
  BACKEND_PORT: "8000"
  BACKEND_HOST: "0.0.0.0"
  
  # Frontend settings
  FRONTEND_PORT: "3000"
  FRONTEND_HOST: "0.0.0.0"
  
  # Agent settings
  AGENT_PORT: "8002"
  AGENT_HOST: "0.0.0.0"
  
  # Database settings
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "todo_db"
  DB_USER: "postgres"
  
  # API endpoints
  BACKEND_API_URL: "http://backend:8000"
  AGENT_API_URL: "http://agent:8002"